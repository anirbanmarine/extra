baseURL: https://extra.anirbanmarine.in
defaultContentLanguage: en
locale: en
title: Study Extra Master

author:
  name: Anirban Das
  email: a@anirbanmarine.in

module:
  imports:
    - path: github.com/imfing/hextra
      
enableInlineShortcodes : true    
ignoreLogs : warning-goldmark-raw-html


menu:
  main:
    - name: Search
      weight: 1
      params:
        type: search
    - name: POLAR
      weight: 2
      url: '/polar_mcq.html'


markup:
  goldmark:
    extensions:
      passthrough:
        delimiters:
          block:
          - - \[
            - \]
          - - $$
            - $$
          inline:
          - - \(
            - \)
        enable: true

params:
  mermaid: {}
  math: 
    engine: katex
    strict: false
  page:
    # full (100%), wide (90rem), normal (1280px)
    width: wide
  # Search
  search:
    enable: true
    type: flexsearch

    flexsearch:
      # index page by: content | summary | heading | title
      index: content  
  sidebar:
     open:false
     
